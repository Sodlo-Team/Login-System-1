<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Anmelden</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2C2F33; /* Discord Dunkelgrau */
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            width: 380px;
            background: #23272A; /* Discord Schwarzgrau */
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        h2 {
            margin: 0 0 25px 0;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
        }

        label {
            font-size: 14px;
            color: #b9bbbe;
            display: block;
            margin-bottom: 6px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: #1e2124;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #5865F2; /* Discord Blau */
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #5865F2; /* Discord Blau */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #4752C4;
        }

        #msg {
            margin-top: 15px;
            color: #ff4d4d;
            text-align: center;
            min-height: 20px;
            font-size: 14px;
        }

        .small-text {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #b9bbbe;
        }

        .small-text a {
            color: #5865F2;
            text-decoration: none;
            font-weight: 600;
        }

        .small-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Anmelden</h2>

    <label for="email">E-Mail-Adresse</label>
    <input id="email" type="email" placeholder="z.B. name@firma.de">

    <label for="password">Passwort</label>
    <input id="password" type="password" placeholder="••••••••">

    <button onclick="login()">Anmelden</button>

    <p id="msg"></p>

    <div class="small-text">
        Kein Konto?  
        <a href="regist.html">Erstelle eins</a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBnE8m5vB6AXOFYtO-FHCsHE6YjuP8iyYE",
    authDomain: "login-system-95b6e.firebaseapp.com",
    projectId: "login-system-95b6e",
    storageBucket: "login-system-95b6e.firebasestorage.app",
    messagingSenderId: "628865613555",
    appId: "1:628865613555:web:471d346277eb8ff6f10186",
    measurementId: "G-E47SD6DJE1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
            window.location.href = "https://sites.google.com/view/sodlo-login/login-auth-D847WWD/startseite-Login";
        })
        .catch(err => {
            document.getElementById("msg").innerText = err.message;
        });
}
</script>

</body>
</html>

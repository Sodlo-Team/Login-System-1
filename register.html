<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrieren</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0078ff;
            outline: none;
            box-shadow: 0 0 5px rgba(0,120,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #005fcc;
        }

        #msg {
            margin-top: 15px;
            color: red;
            font-size: 14px;
            min-height: 20px;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .footer a {
            color: #0078ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrieren</h2>

    <input id="email" type="email" placeholder="E-Mail-Adresse">
    <input id="password" type="password" placeholder="Passwort">

    <button onclick="register()">Konto erstellen</button>

    <p id="msg"></p>

    <div class="footer">
        Bereits ein Konto?  
        <a href="login.html">Jetzt anmelden</a>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBnE8m5vB6AXOFYtO-FHCsHE6YjuP8iyYE",
    authDomain: "login-system-95b6e.firebaseapp.com",
    projectId: "login-system-95b6e",
    storageBucket: "login-system-95b6e.firebasestorage.app",
    messagingSenderId: "628865613555",
    appId: "1:628865613555:web:471d346277eb8ff6f10186",
    measurementId: "G-E47SD6DJE1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function register() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, pass)
        .then(() => {
            window.location.href = "https://sites.google.com/view/sodlo-login/login-auth-D847WWD/startseite-Login";
        })
        .catch(err => {
            document.getElementById("msg").innerText = err.message;
        });
}
</script>

</body>
</html>
